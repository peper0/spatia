name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - name: Install GTest
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev
          cd /usr/src/googletest
          sudo cmake -B build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build build -j
          sudo cmake --install build

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Proves that an installed spatia can be consumed the documented way.
      - name: Install and consume
        run: |
          cmake --install build --prefix "${RUNNER_TEMP}/spatia-install"
          mkdir -p "${RUNNER_TEMP}/consumer"
          cat > "${RUNNER_TEMP}/consumer/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.14)
          project(consumer CXX)
          find_package(spatia REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE spatia::spatia)
          CMAKE
          cat > "${RUNNER_TEMP}/consumer/main.cpp" <<'CPP'
          #include <spatia/spatia.hpp>
          struct A { static constexpr std::size_t dimension = 2; };
          struct B { static constexpr std::size_t dimension = 2; };
          int main() {
              using namespace spatia;
              const auto rotation = to_rotation<A, B>(degrees(90.0));
              return rotation(Vector<A>{1.0, 0.0}).dy() > 0.99 ? 0 : 1;
          }
          CPP
          cmake -S "${RUNNER_TEMP}/consumer" -B "${RUNNER_TEMP}/consumer/build" \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/spatia-install"
          cmake --build "${RUNNER_TEMP}/consumer/build"
          "${RUNNER_TEMP}/consumer/build/consumer"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          find include tests examples benchmarks/transforms_inline_benchmark.cpp \
            \( -name '*.hpp' -o -name '*.cpp' \) \
            -not -path '*/compose_variants/*' -not -path '*/compile_time/*' \
            | xargs clang-format --dry-run --Werror
