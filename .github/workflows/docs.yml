name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one concurrent deployment, letting a newer push supersede a running one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cmake -S . -B build -DBUILD_DOCS=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build --target spatia_docs

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html
          # Preserve v3's inclusion of hidden files in the generated site.
          include-hidden-files: true

  # Publishing runs only for the default branch: pull requests just prove that
  # the documentation still builds.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
